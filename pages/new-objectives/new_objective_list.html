<!DOCTYPE HTML>
<html>
	<head>
		<title>Bingo Nøøørds Brawlers - Season 1</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
        <base href="/Bingo-Nooords-Brawlers-Season-1/">
		<link rel="stylesheet" href="assets/css/main.css" />
		<style>
			#objectives-layout {
				display: grid;
				grid-template-columns: 1fr 4fr;
				gap: 2rem;
			}
			#objective-list {
				width: 350px;
				border-right: 1px solid #ccc;
				padding-right: 1rem;
			}
			#objective-detail {
				padding-left: 1rem;
				display: grid;
				grid-template-columns: 2fr 1fr;
				gap: 2rem;
			}
			#objective-list ul {
				list-style: none;
				padding: 0;
			}
			#objective-list li {
				margin-bottom: 0.5rem;
			}
			#side-bar {
				background-color: #ccc;
				padding: 10px;
				border-radius: 4px;
				height: fit-content;
			}
			.styled-select {
				appearance: none;              /* Remove default arrow (Chrome, Safari) */
				-moz-appearance: none;         /* Remove default arrow (Firefox) */
				-webkit-appearance: none;

				background-color: #fff;
				border: 1px solid #ccc;
				border-radius: 0.5rem;
				padding: 0.5rem 2.5rem 0.5rem 0.75rem;
				font-size: 1rem;
				font-family: inherit;
				color: #333;
				cursor: pointer;
				transition: border-color 0.2s ease, box-shadow 0.2s ease;
				background-image: url("data:image/svg+xml;charset=UTF-8,<svg xmlns='http://www.w3.org/2000/svg' fill='%23333' viewBox='0 0 20 20'><path d='M5.23 7.21a.75.75 0 011.06.02L10 10.94l3.71-3.71a.75.75 0 111.06 1.06l-4.24 4.25a.75.75 0 01-1.06 0L5.21 8.27a.75.75 0 01.02-1.06z'/></svg>");
				background-repeat: no-repeat;
				background-position: right 0.75rem center;
				background-size: 1rem;
				margin-bottom: 1rem;
				}

				.styled-select:hover {
				border-color: #888;
				}

				.styled-select:focus {
				outline: none;
				border-color: #2563eb;
				box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.3); /* blue focus ring */
				}

		</style>
	</head>
	<body class="is-preload">
	
		<div id="banner-placeholder"></div>
		<script>
		  fetch('assets/html/banner.html')
		    .then(res => res.text())
		    .then(html => {
		      document.getElementById('banner-placeholder').innerHTML = html;
		    });
		</script>
		
		<div id="page-wrapper">
			<div id="navbar-placeholder"></div>
			<script>
			  fetch('assets/html/navbar.html')
			    .then(response => response.text())
			    .then(data => {
			      document.getElementById('navbar-placeholder').innerHTML = data;
			    });
			</script>
		</div>

		<section class="wrapper style1">
			<div class="container">
				<div id="content">
					<article>
						<header>
							<h2>Complete list of all objectives</h2>
							<p>Git gud, learn the objectives</p>
						</header>
						
					</article>
				</div>
			</div>
		</section>

        <section class="wrapper style1">
			<div class="container" id="objectives-layout">
                <div>
					<div>
						<label for="category">Kategori:</label>
						<select class="styled-select" id="category" name="category">
							<option value="all" selected>Alle oppdrag</option>
							<option value="handicap">Forenkla oppdrag</option>
							<option value="base">Orginale oppdrag</option>
						</select>
					</div>

                    <h3>All Objectives</h3>
                    <div id="objective-list"
                        style="min-height: 800px; max-height: 1200px; overflow-y: scroll; background-color: #f7f7f7; border-radius: 2px;"
                    ></div>
                </div>
				<div id="objective-detail"></div>
            </div>
        </section>

        <!-- Footer -->
        <div id="footer">
            <div class="container">
                <div class="copyright">
                    <ul class="menu">
                        <p>All rights reserved your almighty Gud God, LaZarus<p>
                    </ul>
                </div>
            </div>
        </div>

        <!-- Scripts -->
		<script src="assets/js/jquery.min.js"></script>
		<script src="assets/js/jquery.dropotron.min.js"></script>
		<script src="assets/js/browser.min.js"></script>
		<script src="assets/js/breakpoints.min.js"></script>
		<script src="assets/js/util.js"></script>
		<script src="assets/js/main.js"></script>

		<!-- Dynamic Objective Script -->
		<script>
		const basePath = "pages/new-objectives/new_objective_list.html";
		let objectives = [];
		let needToUpdate = true;
		const filters = [];

		const select = document.querySelector('select');
		select.value = window.localStorage.getItem("category") ?? "all";

		select.addEventListener('change', (e) => {
			needToUpdate = true;
			window.localStorage.setItem("category", e.target.value)
			render()
		});

		async function fetchObjectives(sources) {
			if (needToUpdate) {
				objectives = [];
				for (const src of sources) {
					const response = await fetch(src);
					const list = await response.json();
					objectives = [...objectives, ...list];
				}
				needToUpdate = false;
			}

			return objectives.sort((a,b) => a.name.toLocaleLowerCase().localeCompare(b.name.toLocaleLowerCase()));
		}

		function getSources() {
			category = window.localStorage.getItem("category") ?? "all";
			switch (category) {
				case "all": return ["assets/objective_details.json", "assets/hand_objectives.json"];
				case "handicap": return ["assets/hand_objectives.json"];
				case "base": return ["assets/objective_details.json"];
				default: console.warn("Hva faen?!")
			}
		}

		function clearElement(el) {
			while (el.firstChild) {
				el.removeChild(el.firstChild);
			}
		}

		function generateListFromJSON(data) {
			const ul = document.createElement("ul");

			data.forEach((item) => {
				const li = document.createElement("li");

				if (item.text) {
					li.innerHTML = item.text;
				}

				if (item.children && item.children.length > 0) {
					const childUl = generateListFromJSON(item.children);
					li.appendChild(childUl);
				}

				ul.appendChild(li);
			});

			return ul;
		}


		function buildObjectiveList() {
			const listContainer = document.getElementById("objective-list");
			clearElement(listContainer);

			const ul = document.createElement("ul");
			let previousLetter = "?";
			objectives.forEach(obj => {
				const li = document.createElement("li");
				const link = document.createElement("a");
				link.href = "#";
				link.textContent = obj.name;
				link.addEventListener("click", (e) => {
					e.preventDefault();
					history.pushState({}, "", `${basePath}#id=${obj.id}`);
					render();
				});
				if (previousLetter[0] !== obj.name[0]){
					const h4 = document.createElement("h4");
					h4.innerText = obj.name[0];
					h4.style.marginBlockEnd = "2px";
					h4.style.marginInlineStart = "10px";
					ul.appendChild(h4);
					previousLetter = obj.name[0];
				}
				li.appendChild(link);
				ul.appendChild(li);
			});
			listContainer.appendChild(ul);
		}

		function showObjectiveDetail(obj) {
			const container = document.getElementById("objective-detail");
			clearElement(container);

			const article = document.createElement("article");
			const header = document.createElement("header");
			const h2 = document.createElement("h2");
			h2.textContent = obj.name;
			header.appendChild(h2);
			article.appendChild(header);

			obj.type.forEach((t, i) => {
				if (t === "headline") {
					const h3 = document.createElement("h3");
					h3.innerHTML = obj.content[i];
					article.appendChild(h3);
				} else if (t === "paragraph") {
					const p = document.createElement("p");
					p.innerHTML = obj.content[i];
					article.appendChild(p);
				} else if (t === "list") {
					// const ul = document.createElement("ul");
					// obj.content[i].forEach(item => {
					// 	const li = document.createElement("li");
					// 	li.textContent = item;
					// 	ul.appendChild(li);
					// });
					const ul = generateListFromJSON(obj.content[i])
					article.appendChild(ul);
				} else if (t === "image") {
					const span = document.createElement("span");
					span.className = "image featured";
					const img = document.createElement("img");
					img.src = obj.content[i];
					img.alt = "";
					img.style.maxWidth = "450px";
					span.appendChild(img);
					article.appendChild(span);
				}
			});

			const handleSidebar = (sidebar, parentElement) => {
				const sidebarElement = document.createElement("section");
				for (let i = 0; i < sidebar.type.length; i++) {
					const article = document.createElement("article");
					article.style.paddingBlockEnd = "10px";
					for (let j = 0; j < sidebar.type[i].length; j++) {
						const t = sidebar.type[i][j];
						const c = sidebar.content[i][j];

						if (!t || !c) 					
							continue;

						if (t === "headline") {
							const header = document.createElement("h4");
							header.style.marginBlockEnd = "2px";
							header.textContent = c;
							article.appendChild(header);
						} else if (t === "link") {
							const link = document.createElement("a");
							link.textContent = c.text;
							link.href = c.href;
							link.target = "_blank";
							article.appendChild(link);
							link.style.backgroundColor = "white";
							link.style.padding = "2px";
							link.style.borderRadius = "4px";
							link.style.color = "black";
							link.style.display = "block";
							link.style.textAlign = "center";
							link.style.marginBlock = "2px";
						} else if (t === "list") {
							const ul = generateListFromJSON(c)
							article.appendChild(ul);
						} else if (t === "paragraph") {
							const p = document.createElement("p");
							p.textContent = c;
							article.appendChild(p);
						} else if (t === "image") {
							const img = document.createElement("img");
							img.src = c;
							img.alt = "";
							img.style.maxWidth = "250px";
							img.style.height = "auto"
							article.appendChild(img);
						}
					}

					sidebarElement.appendChild(article);
				}
				parentElement.appendChild(sidebarElement);
			}

			const side = document.createElement("section");
			side.style.display = "flex";
			side.style.flexDirection = "column";
			side.id = "side-bar"
			if (obj.sidebar1?.type) {
				handleSidebar(obj.sidebar1, side);
			}
			
			if (obj.sidebar2?.type) {
				handleSidebar(obj.sidebar2, side);
			}


			container.appendChild(article);
			container.appendChild(side);
		}

		async function render() {
			const sources = getSources();
			if (!sources?.length) sources = ["assets/objective_details.json", "assets/hand_objectives.json"];

			await fetchObjectives(sources);
			buildObjectiveList();

			const hash = window.location.hash.substring(1); 
			const params = new URLSearchParams(hash);
			const id = params.get("id");
			// const params = new URLSearchParams(window.location.search);
			// const id = params.get("id");

			if (!id) {
				// Clear detail view if none selected
				clearElement(document.getElementById("objective-detail"));
			} else {
				const obj = objectives.find(o => o.id == id);
				if (obj) {
					showObjectiveDetail(obj);
				} else {
					const container = document.getElementById("objective-detail");
					clearElement(container);
					const p = document.createElement("p");
					p.textContent = "Objective not found.";
					container.appendChild(p);
				}
			}
		}

		// Listen to back/forward navigation
		window.addEventListener("popstate", render);

		// Initial render
		render();
		</script>
	</body>
</html>
